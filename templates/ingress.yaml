{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quickstart-java-service.fullname" . }}
  labels:
    {{- include "quickstart-java-service.labels" . | nindent 4 }}
  {{- $konveyor := include "quickstart-java-service.konveyorAnnotations" . | fromYaml }}
  {{- $merged := merge (default dict .Values.ingress.annotations) $konveyor }}
  {{- with $merged }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "quickstart-java-service.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
